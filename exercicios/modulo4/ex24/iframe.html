<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            width: 500px;
            height: 500px;
            border: 1px dashed black;
        }
    </style>
</head>
<body>
    <h1>Testanto o uso de iframe</h1>
    <p>Acessano o site do  
        
        <iframe src="https://www.cursoemvideo.com" frameborder="1" height="500" scolling="no"></iframe>
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em video</a>
        para aprender a programar.</p>
        <p>O repositório do Guanabara no
            
            <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="200" width="600"></iframe>
                <a href="https://gustavoguanabara.github.io" target="_blank">Github</a>
            também é bem legal!</p>
</body>
</html>
